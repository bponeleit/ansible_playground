---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: zfs-hci-shared
provisioner: zfs.csi.openebs.io
parameters:
  poolname: "tank/k8s-data"
  fstype: "zfs"
  shared: "yes"         # <--- This enables the "RWX" behavior on one node
  compression: "lz4"    # Faster than zstd for HDDs (less CPU wait)
  aclinherit: "passthrough"
  logbias: "throughput" # Optimized for spinning rust (bypasses ZIL overhead)
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: zfs-hci
provisioner: zfs.csi.openebs.io
parameters:
  poolname: "tank/k8s-data"
  fstype: "zfs"
  compression: "lz4"      # Native LZ4 compression
  aclinherit: "passthrough"
  logbias: "throughput" # Optimized for spinning rust (bypasses ZIL overhead)
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
