---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tika
  labels:
    app: tika
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tika
  template:
    metadata:
      labels:
        app: tika
    spec:
      containers:        
        - name: tika
          image: docker.io/apache/tika:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9998
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true     # Upgraded for v1.36 hardening
            runAsNonRoot: true               # Upgraded for v1.36 hardening
            runAsUser: 1001
            seccompProfile:                  # Upgraded for v1.36 hardening
              type: RuntimeDefault
            appArmorProfile:                 # Upgraded for v1.36 hardening
              type: RuntimeDefault
            capabilities:                    # Upgraded for v1.36 hardening
              drop:
                - ALL              
---
apiVersion: v1
kind: Service
metadata:
  name: tika
  labels:
    app: tika
spec:
  type: ClusterIP
  ports:
    - port: 9998
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: tika