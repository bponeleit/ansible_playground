apiVersion: apps/v1
kind: Deployment
metadata:
  name: gotenberg
  labels:
    app: gotenberg
spec:  
  replicas: 1
  progressDeadlineSeconds: 120
  selector:
    matchLabels:
      app: gotenberg
  template:
    metadata:
      labels:
        app: gotenberg        
    spec:
      containers:
        - name: gotenberg
          image: gotenberg/gotenberg:8
          imagePullPolicy: gotenberg/gotenberg:8
          args:
          - gotenberg
          - --api-port=3000      
          - --chromium-allow-list=file:///tmp/.*
          - --chromium-disable-javascript=true
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: gotenberg
  labels:
    app: gotenberg
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: gotenberg
