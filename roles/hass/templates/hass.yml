---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: home-assistant
  template:
    metadata:
      labels:
        app: home-assistant
    spec:
      containers:
        - name: home-assistant
          image: ghcr.io/home-assistant/home-assistant:stable
          ports:
            - containerPort: 8123
          volumeMounts:
            - name: home-assistant-storage
              mountPath: /config
          env:
            - name: TZ
              value: Europe/London

      volumes:
        - name: home-assistant-storage
          persistentVolumeClaim:
            claimName: home-assistant-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: home-assistant-data
  labels:
    app: home-assistant
spec:
  storageClassName: managed-nfs-storage
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi            
---
apiVersion: v1			  
kind: Service
metadata:
  name: home-assistant
spec:
  ports:
    - name: home-assistant
      port: 8123    
      targetPort: 8123  
  selector:
    app: home-assistant  		  
  type: LoadBalancer
  loadBalancerIP: 192.168.179.10