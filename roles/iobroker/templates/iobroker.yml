---
apiVersion: apps/v1
kind: StatefulSet
metadata:
    labels:
        app: iobroker
    name: iobroker
spec:
    replicas: 1
    selector:
        matchLabels:
            app: iobroker
    serviceName: iobroker
    template:
        metadata:
            labels:
                app: iobroker
        spec:
            containers:
              - image: buanet/iobroker:latest-v10
                name: iobroker
                ports:
                  - containerPort: 8081
                    name: iobroker
                volumeMounts:
                  - mountPath: /opt/iobroker
                    name: data
    volumeClaimTemplates:
      - metadata:
            name: data
        spec:
            storageClassName: managed-nfs-storage
            accessModes:
              - ReadWriteOnce
            resources:
                requests:
                    storage: 100Mi
---
apiVersion: v1
kind: Service
metadata:
    name: iobroker
spec:
    ports:
      - name: iobroker
        port: 8081
        targetPort: 8081
    selector:
        app: iobroker
    type: LoadBalancer
    loadBalancerIP: 192.168.179.8